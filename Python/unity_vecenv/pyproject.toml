[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-vecenv"
version = "0.1.9"
description = "Gymnasium-compatible vectorized reinforcement-learning environments backed by Unity."
readme = "README.md"
authors = [
    { name = "Mart Kartasev", email = "mart.kartasev@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "gymnasium",
    "reinforcement-learning",
    "unity",
    "vector-environment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.2,<2",
    "numpy>=1.23.5,<3",
    "protobuf>=4.25,<8",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.16,<2",
    "torch>=2.2,<3",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "twine>=5,<7",
]

[project.scripts]
unity-vecenv = "unity_vecenv.cli:main"

[project.urls]
Documentation = "https://github.com/martkartasev/UnityVecEnv/tree/master/docs"
Issues = "https://github.com/martkartasev/UnityVecEnv/issues"
"Release notes" = "https://github.com/martkartasev/UnityVecEnv/releases"
Repository = "https://github.com/martkartasev/UnityVecEnv"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"unity_vecenv.protobuf_gen" = ["*.pyi"]
