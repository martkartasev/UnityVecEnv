syntax = "proto3";
package ExternalCommunication;

enum AutoResetMode {
  NextStep = 0;
  SameStep = 1;
  Disabled = 2;
}

message InitializeEnvironments {
  AutoResetMode autoResetMode = 1;
  int32 requestedNumberOfEnvs = 2;
  repeated EnvironmentParameter parameters = 3;
}

message EnvironmentDescription {
  repeated Space singleObservationSpace = 1;
  repeated Space singleActionSpace = 2;
  int32 trueNumberOfEnvs = 3;
  repeated VisualObservationSpace singleVisualObservationSpace = 4;
  repeated EnvironmentParameter parameters = 5;
}

message EnvironmentParameter {
  string key = 1;

  oneof value {
    string string_value = 2;
    float float_value = 3;
    int32 int_value = 4;
  }
}

message Space {
  string name = 1;

  int32 continuousSize = 2;
  repeated MinMax continuousRange = 3;

  repeated int32 discreteSize = 4;
}

message MinMax {
  int32 index = 1;

  float minValue = 2;
  float maxValue = 3;
}

message Reset {
  repeated ResetParameters envsToReset = 1;
  bool reloadScene = 2;
}

message ResetParameters {
  int32 index = 1;
  repeated float continuous = 2;
  optional int32 seed = 3;
}

message Step {
  repeated Action actions = 1;
  optional int32 stepCount = 2;
  optional float timeScale = 3;
  bool applyActionEveryPhysicsStep = 4;
  repeated string uiStrings = 5;
}

message Action {
  int32 agentIndex = 1;

  repeated float continuous = 2;
  repeated int32 discrete = 3;
}

message Observation {
  int32 index = 1;

  repeated float continuous = 2;
  repeated int32 discrete = 3;
}

enum VisualObservationDataType {
  UInt8 = 0;
  Float32 = 1;
}

message VisualObservationSpace {
  string name = 1;
  repeated int32 shape = 2;
  VisualObservationDataType dataType = 3;
  float low = 4;
  float high = 5;
}

message BatchedVisualObservation {
  string name = 1;
  bytes data = 2;
}

message BatchedObservation {
  int32 num_envs = 1;
  int32 continuous_size = 2;
  int32 discrete_size = 3;
  bytes continuous_f32 = 4;
  bytes discrete_i32 = 5;
  repeated BatchedVisualObservation visual = 6;
}

message BatchedCustomInfo {
  repeated string keys = 1;
  bytes values_f32 = 2;
  bytes present = 3;
  repeated string keys_i32 = 4;
  bytes values_i32 = 5;
  bytes present_i32 = 6;
  repeated string keys_bool = 7;
  bytes values_bool = 8;
  bytes present_bool = 9;
  repeated string keys_vector3 = 10;
  bytes values_vector3_f32 = 11;
  bytes present_vector3 = 12;
  repeated string keys_quaternion = 13;
  bytes values_quaternion_f32 = 14;
  bytes present_quaternion = 15;
}

message BatchedFinalInfo {
  BatchedObservation final_observation = 1;
}

message BatchedStepResults {
  BatchedObservation observation = 1;
  bytes rewards_f32 = 2;
  bytes dones = 3;
  bytes truncates = 4;
  bytes custom_indices_i32 = 5;
  BatchedCustomInfo custom = 6;
  bytes final_indices_i32 = 7;
  BatchedFinalInfo final_info = 8;
}

message BatchedResetResults {
  BatchedObservation observation = 1;
  bytes custom_indices_i32 = 2;
  BatchedCustomInfo custom = 3;
}

message Screenshot {
  Transform camera = 1;
}

message Transform {
  Vector3 position = 1;
  optional Vector3 euler = 2;
  optional Quaternion orientation = 3;
}

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}
